<script>
/* =====================================================================
   FIREBASE-KONFIGURATION
   Für den gemeinsamen Punktestand hier die Konfiguration aus der
   Firebase-Konsole einfügen (Projekteinstellungen → Meine Apps → Web-App).
   Wichtig: "databaseURL" muss enthalten sein.
   Bleibt hier null stehen, läuft die App im lokalen Modus (ein Gerät).

   Beispiel:
   window.FIREBASE_CONFIG = {
     apiKey: "AIza...",
     authDomain: "mein-projekt.firebaseapp.com",
     databaseURL: "https://mein-projekt-default-rtdb.europe-west1.firebasedatabase.app",
     projectId: "mein-projekt",
     appId: "1:123:web:abc"
   };
   ===================================================================== */
window.FIREBASE_CONFIG = {
  apiKey: "AIzaSyCnztCiYTyNeQvVTFKBkf8YNHr4Q7q_IO0",
  authDomain: "wikipedia-speedrun-9af67.firebaseapp.com",
  databaseURL: "https://wikipedia-speedrun-9af67-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "wikipedia-speedrun-9af67",
  storageBucket: "wikipedia-speedrun-9af67.firebasestorage.app",
  messagingSenderId: "354888082253",
  appId: "1:354888082253:web:e2b6c55648eacff3ff0d04"
};
</script>
<style>
:root{
  --bg:#f5f2ea; --card:#fff; --ink:#1d2321; --muted:#68716d; --line:#e3ded2;
  --green:#1e5a44; --green2:#2b7a5c; --red:#b3261e; --gold:#c4952b; --link:#0645ad;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
button,input,select{font:inherit}
header.top{background:var(--green);color:#fff;padding:12px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header.top h1{font-size:1.15rem;margin:0;font-weight:650;letter-spacing:.2px}
header.top .star{color:var(--gold);font-size:1.3rem}
header.top .sp{flex:1}
header.top .mini{font-size:.85rem;opacity:.95;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
header.top .mini b{color:#ffe7a8}
.chip{background:rgba(255,255,255,.14);border-radius:99px;padding:3px 10px;font-size:.85rem;display:inline-flex;gap:7px;align-items:center}
.chip b{letter-spacing:2px;color:#ffe7a8}
.chip button{background:none;border:0;color:#fff;text-decoration:underline;cursor:pointer;padding:0;font-size:.8rem}
.dot{width:8px;height:8px;border-radius:50%;background:#8fd19e;display:inline-block}
.dot.off{background:#f08a80}
main{max-width:1100px;margin:0 auto;padding:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:18px}
.card h2{margin:0 0 14px;font-size:1.15rem}
.grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px}
@media (max-width:820px){.grid{grid-template-columns:1fr} main{padding:14px}}
label{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 4px}
input[type=text],select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff}
input[type=text]:focus,select:focus{outline:2px solid var(--green2);border-color:transparent}
.row{display:flex;gap:8px;align-items:center}
.row > input{flex:1}
.btn{border:0;border-radius:8px;padding:9px 16px;cursor:pointer;background:var(--green);color:#fff;font-weight:600}
.btn:hover{background:var(--green2)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sec{background:#ece8de;color:var(--ink)}
.btn.sec:hover{background:#e2ddd0}
.btn.red{background:var(--red)}
.btn.big{padding:14px 28px;font-size:1.1rem}
.btn.small{padding:5px 10px;font-size:.85rem}
.hint{font-size:.85rem;color:var(--muted);margin-top:6px}
.banner{background:#fff6dc;border:1px solid #ecd9a0;border-radius:10px;padding:10px 14px;font-size:.9rem;margin-bottom:18px}
.preview{font-size:.85rem;color:var(--muted);margin-top:6px;min-height:1.2em}
.preview.ok b{color:var(--green)}
.preview.err{color:var(--red)}
table.t{width:100%;border-collapse:collapse}
table.t th,table.t td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top;font-size:.95rem}
table.t th{font-size:.8rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.num{font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.78rem;font-weight:600;white-space:nowrap}
.pill.ok{background:#e1f1e8;color:var(--green)}
.pill.gave{background:#f7e3e1;color:var(--red)}
.pill.open{background:#efece4;color:var(--muted)}
.pill.live{background:#fff1cc;color:#8a6510}
.pt{color:var(--gold);font-weight:700;white-space:nowrap}
.route{font-size:1.2rem;font-weight:650;margin:2px 0 6px}
.route .arr{color:var(--gold);margin:0 8px}
.extract{font-size:.88rem;color:var(--muted);margin:0}
.center{text-align:center}
.ready h2{font-size:2rem;margin:10px 0}
.ready .route{font-size:1.5rem;margin:18px 0}
.path{font-size:.85rem;color:var(--muted);word-break:break-word}
.path span.step{color:var(--ink)}
.manual{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
.manual input{width:90px;padding:5px 8px;border:1px solid var(--line);border-radius:6px}
.score li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}
.score ol{list-style:none;margin:0;padding:0}
.score .tot{font-weight:700;font-variant-numeric:tabular-nums}
.teams-edit .row{margin-bottom:6px}
.join{max-width:520px;margin:30px auto}
.join .code{text-transform:uppercase;letter-spacing:4px;font-weight:700;text-align:center;font-size:1.3rem}

/* Spielansicht */
.playbar{position:sticky;top:0;z-index:10;background:var(--green);color:#fff;padding:10px 22px;display:flex;gap:22px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.playbar .who{font-weight:700}
.playbar .goal{font-size:.95rem}
.playbar .goal b{color:#ffe7a8}
.playbar .stat{text-align:center}
.playbar .stat .v{font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.playbar .stat .l{font-size:.7rem;opacity:.8;text-transform:uppercase;letter-spacing:.5px}
.playbar .sp{flex:1}
.playbar .path{color:#d8eadf;flex-basis:100%;font-size:.8rem}
.playbar .path span.step{color:#fff}
@media (max-width:600px){.playbar{gap:12px;padding:8px 12px}.playbar .stat .v{font-size:1.25rem}}
.article{max-width:960px;margin:20px auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px 32px;position:relative}
@media (max-width:600px){.article{margin:10px 6px;padding:14px 14px}}
.article h1.atitle{font-family:"Linux Libertine","Georgia","Times",serif;font-weight:400;font-size:2rem;border-bottom:1px solid #a2a9b1;margin:0 0 14px;padding-bottom:4px}
.wk{font-size:.95rem;line-height:1.6;overflow-x:auto}
.wk img{max-width:100%;height:auto}
.wk table{font-size:.85rem;max-width:100%}
.wk .infobox,.wk table.wikitable{border-collapse:collapse;background:#f8f9fa;border:1px solid #a2a9b1;margin:0 0 12px 16px}
.wk .infobox{float:right;max-width:320px}
@media (max-width:600px){.wk .infobox,.wk figure,.wk .thumb{float:none;margin:0 0 12px 0;max-width:100%}}
.wk h2{font-family:"Linux Libertine","Georgia","Times",serif;font-weight:400;font-size:1.5rem;border-bottom:1px solid #a2a9b1;margin-top:1.2em}
.wk h3{font-size:1.15rem}
.wk figure,.wk .thumb{float:right;clear:right;margin:4px 0 12px 16px;max-width:260px;font-size:.8rem;color:#54595d}
.wk a{color:#7a8580;text-decoration:none;cursor:default;pointer-events:none}
.wk a.ok{color:var(--link);pointer-events:auto;cursor:pointer;text-decoration:none;border-bottom:1px solid rgba(6,69,173,.3)}
.wk a.ok:hover{background:#eaf1ff;border-bottom-color:var(--link)}
.wk sup.reference{display:none}
.wk .mw-editsection,.wk .navbox,.wk .mw-empty-elt{display:none}
.loading{position:absolute;inset:0;background:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--green);border-radius:10px;font-size:1.1rem}
.err-box{background:#fbe9e7;color:var(--red);padding:10px 14px;border-radius:8px;margin:10px 0}
.won{font-size:3rem;margin:4px 0}
.bigstats{display:flex;gap:40px;justify-content:center;margin:18px 0}
.bigstats .v{font-size:2.4rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--green)}
.bigstats .l{font-size:.8rem;color:var(--muted);text-transform:uppercase}
.rules{font-size:.9rem;color:var(--muted);margin:0;padding-left:18px}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:.85rem}
</style>
</head>
<body>
<div id="app"><main><div class="card center">Lade …</div></main></div>
<script>
(() => {
"use strict";

/* =====================================================================
   Zustand
   S = gemeinsamer Spielstand (Firebase oder lokal)
   L = nur dieses Gerät (Ansicht, laufender Lauf, Eingaben)
   ===================================================================== */
const LS_KEY = "wikiSpeedrun.weihnachten.v1";
const LS_DRAFT = "wikiSpeedrun.weihnachten.draft";
const FB_VERSION = "10.12.2";
const CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";

const defaults = () => ({ lang: "de", teams: ["Team 1", "Team 2", "Team 3"], totals: [0, 0, 0], history: [], round: null });
let S = defaults();
const L = {
  view: "loading", run: null, lastResult: null, manualOpen: null, resetArmed: false,
  draft: loadJSON(LS_DRAFT) || { start: "", target: "" },
  room: null, connected: true, pendingRender: false, notice: ""
};
let tick = null;

function loadJSON(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function saveJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

const toArr = v => Array.isArray(v) ? v : (v && typeof v === "object")
  ? Object.keys(v).sort((a, b) => a - b).map(k => v[k]) : [];

/* Firebase lässt leere Listen und null-Werte weg und macht aus Listen
   manchmal Objekte. normalize() bringt alles wieder in Form. */
function normalize(raw) {
  const s = raw ? JSON.parse(JSON.stringify(raw)) : {};
  const d = defaults();
  s.lang = s.lang || d.lang;
  s.teams = toArr(s.teams).filter(t => typeof t === "string");
  if (!s.teams.length) s.teams = d.teams;
  const tot = toArr(s.totals);
  s.totals = s.teams.map((_, i) => Number(tot[i]) || 0);
  s.history = toArr(s.history).filter(Boolean);
  if (s.round) {
    const r = s.round;
    const res = {}, pl = {};
    /* clean() speichert Teams als "t0", "t1" …, damit Firebase keine Listen daraus macht */
    const key = k => String(k).replace(/^t/, "");
    if (r.results) for (const k of Object.keys(r.results)) if (r.results[k]) res[key(k)] = r.results[k];
    if (r.playing) for (const k of Object.keys(r.playing)) if (r.playing[k]) pl[key(k)] = r.playing[k];
    r.results = res; r.playing = pl;
    Object.values(r.results).forEach(x => { x.path = x.path ? toArr(x.path) : null; });
    r.points = r.points ? toArr(r.points).map(p => ({ fast: (p && p.fast) || 0, few: (p && p.few) || 0 })) : null;
    if (!r.start || !r.target) s.round = null;
  } else s.round = null;
  return s;
}
const getRes = i => (S.round && S.round.results[i]) || null;

/* =====================================================================
   Speicher: lokal oder Firebase (gleiche Schnittstelle)
   ===================================================================== */
const Store = {
  mode: "local", db: null, ref: null,

  async init() {
    if (!window.FIREBASE_CONFIG) return this.useLocal();
    try {
      await loadScript(`https://www.gstatic.com/firebasejs/${FB_VERSION}/firebase-app-compat.js`);
      await loadScript(`https://www.gstatic.com/firebasejs/${FB_VERSION}/firebase-database-compat.js`);
      if (!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
      this.db = firebase.database();
      this.mode = "online";
      this.db.ref(".info/connected").on("value", snap => { L.connected = !!snap.val(); updateHeader(); });
    } catch (e) {
      console.error(e);
      L.notice = "Die Online-Datenbank konnte nicht geladen werden. Die App läuft deshalb nur auf diesem Gerät.";
      this.useLocal();
    }
  },

  useLocal() {
    this.mode = "local";
    S = normalize(loadJSON(LS_KEY));
  },

  /* Spielraum betreten, Änderungen live empfangen */
  join(code) {
    this.leave();
    L.room = code;
    this.ref = this.db.ref("speedrun/" + code);
    this.ref.on("value", snap => { S = normalize(snap.val()); onState(); },
      err => { L.notice = "Kein Zugriff auf die Datenbank (" + err.message + "). Stimmen die Regeln in Firebase?"; onState(); });
  },
  leave() { if (this.ref) this.ref.off(); this.ref = null; L.room = null; },

  async exists(code) {
    const snap = await this.db.ref("speedrun/" + code + "/teams").once("value");
    return snap.exists();
  },

  async create() {
    for (let n = 0; n < 5; n++) {
      const code = Array.from({ length: 5 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join("");
      const ref = this.db.ref("speedrun/" + code);
      const base = defaults(); base.createdAt = Date.now();
      const res = await ref.transaction(cur => cur === null ? clean(base) : undefined);
      if (res.committed) return code;
    }
    throw new Error("Kein freier Code gefunden");
  },

  /* mut(s) verändert den Zustand; gibt mut false zurück, wird nichts geändert */
  async update(mut) {
    if (this.mode === "local") {
      const s = normalize(S);
      if (mut(s) === false) return false;
      S = normalize(s); saveJSON(LS_KEY, S); onState();
      return true;
    }
    const res = await this.ref.transaction(cur => {
      const s = normalize(cur);
      if (mut(s) === false) return undefined;
      return clean(s);
    });
    return res.committed;
  }
};

/* Für Firebase: undefined entfernen, Ergebnisse als Objekt speichern */
function clean(s) {
  const c = JSON.parse(JSON.stringify(s));
  if (c.round) {
    ["results", "playing"].forEach(k => {
      const o = {}; const src = c.round[k] || {};
      Object.keys(src).forEach(i => { if (src[i] != null) o["t" + i] = src[i]; });
      c.round[k] = o;
    });
  }
  return c;
}

function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src; s.onload = res; s.onerror = () => rej(new Error("Script nicht geladen: " + src));
    document.head.appendChild(s);
    setTimeout(() => rej(new Error("Zeitüberschreitung")), 15000);
  });
}

/* =====================================================================
   Helfer
   ===================================================================== */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function fmtTime(sec) {
  if (sec == null || isNaN(sec)) return "–";
  const t = Math.max(0, Math.round(sec * 10));
  const m = Math.floor(t / 600), s = Math.floor((t % 600) / 10), d = t % 10;
  return `${m}:${String(s).padStart(2, "0")},${d}`;
}
function parseTime(str) {
  str = String(str).trim().replace(",", ".");
  if (!str) return NaN;
  if (str.includes(":")) { const [m, s] = str.split(":"); return Number(m) * 60 + Number(s); }
  return Number(str);
}
const now = () => performance.now();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* =====================================================================
   Wikipedia-API
   ===================================================================== */
async function api(params) {
  const url = `https://${S.lang}.wikipedia.org/w/api.php?` +
    new URLSearchParams({ ...params, format: "json", formatversion: "2", origin: "*" });
  const r = await fetch(url);
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
async function resolveTitle(t) {
  const d = await api({ action: "query", titles: t, redirects: "1", prop: "extracts", exintro: "1", explaintext: "1", exsentences: "2" });
  const p = d.query && d.query.pages && d.query.pages[0];
  if (!p || p.missing || p.invalid) return null;
  if (p.ns !== 0) return null;
  return { title: p.title, extract: p.extract || "" };
}
async function randomTitle() {
  const d = await api({ action: "query", list: "random", rnnamespace: "0", rnlimit: "1" });
  return d.query.random[0].title;
}
async function fetchArticle(t) {
  const d = await api({ action: "parse", page: t, redirects: "1", prop: "text", disableeditsection: "1", disablelimitreport: "1", disabletoc: "1" });
  if (d.error) throw new Error(d.error.info || "Artikel nicht gefunden");
  return { title: d.parse.title, html: d.parse.text };
}

/* Namensräume, deren Links nicht zählen (de + en) */
const NS = new Set(["datei","file","bild","image","media","medium","kategorie","category","hilfe","help","wikipedia","wp","portal","vorlage","template","spezial","special","benutzer","benutzerin","user","diskussion","talk","modul","module","draft","mediawiki","wikt","wiktionary","commons","s","q","n","b","v","d","w","de","en"]);
const EXCLUDE = 'table,figure,.thumb,.infobox,.navbox,.hatnote,[role="note"],.reference,.references,.mw-references-wrap,.gallery,.sidebar,.toc,#toc,.navigation-not-searchable,.metadata,#coordinates,.coordinates,sup,.mw-empty-elt';

function linkTitle(a) {
  const h = a.getAttribute("href") || "";
  if (!h.startsWith("/wiki/") && !h.startsWith("./")) return null;
  if (a.classList.contains("new") || a.classList.contains("external")) return null;
  let t = h.startsWith("/wiki/") ? h.slice(6) : h.slice(2);
  const hi = t.indexOf("#"); if (hi >= 0) t = t.slice(0, hi);
  if (t.indexOf("?") >= 0) return null;
  try { t = decodeURIComponent(t); } catch (e) {}
  t = t.replace(/_/g, " ").trim();
  if (!t) return null;
  const ci = t.indexOf(":");
  if (ci > 0 && NS.has(t.slice(0, ci).trim().toLowerCase())) return null;
  return t;
}
function isParagraphLink(a) {
  if (!a.closest("p")) return false;
  if (a.closest(EXCLUDE)) return false;
  return true;
}
function prepareArticle(html) {
  const box = document.createElement("div");
  box.className = "wk";
  box.innerHTML = html;
  box.querySelectorAll("link, script, .mw-editsection").forEach(n => n.remove());
  box.querySelectorAll("img").forEach(img => {
    ["src", "srcset"].forEach(at => {
      const v = img.getAttribute(at);
      if (v) img.setAttribute(at, v.replace(/(^|\s|,)\/\//g, "$1https://"));
    });
    img.loading = "lazy";
  });
  box.querySelectorAll("a").forEach(a => {
    const t = linkTitle(a);
    if (t && isParagraphLink(a)) {
      a.classList.add("ok"); a.dataset.go = t; a.setAttribute("href", "#");
    } else {
      a.removeAttribute("href"); a.removeAttribute("title");
    }
  });
  return box;
}

/* =====================================================================
   Rendern
   ===================================================================== */
const SHARED_VIEWS = ["setup", "round"];

/* Neuer gemeinsamer Zustand ist da */
function onState() {
  if (SHARED_VIEWS.includes(L.view)) L.view = S.round ? "round" : "setup";
  if (L.view === "ready" && (!S.round || S.round.id !== L.run.roundId)) { L.run = null; L.view = S.round ? "round" : "setup"; }
  if (L.view === "loading") L.view = S.round ? "round" : "setup";
  if (["play", "ready", "finish"].includes(L.view)) { updateHeader(); return; }
  /* Nicht neu zeichnen, während jemand tippt */
  const ae = document.activeElement;
  if (ae && ae.tagName === "INPUT" && $("#app").contains(ae)) { L.pendingRender = true; updateHeader(); return; }
  render();
}

function render() {
  L.pendingRender = false;
  if (L.view !== "play") stopTick();
  const app = $("#app");
  const views = { join: joinView, setup: setupView, round: roundView, ready: readyView, finish: finishView };
  if (L.view === "play") app.innerHTML = playShell();
  else app.innerHTML = header() + `<main>${noticeBox()}${(views[L.view] || (() => ""))()}</main>`;
  bind();
}

function noticeBox() {
  let out = L.notice ? `<div class="banner">${esc(L.notice)}</div>` : "";
  if (Store.mode === "local" && !L.notice && L.view === "setup")
    out += `<div class="banner">Lokaler Modus: Punktestand nur auf diesem Gerät. Für einen gemeinsamen Punktestand oben in der Datei die Firebase-Konfiguration eintragen.</div>`;
  return out;
}

function headerInner() {
  const scores = L.view === "join" ? "" : S.teams.map((t, i) => `<span>${esc(t)}: <b>${S.totals[i] || 0}</b></span>`).join("");
  const room = Store.mode === "online" && L.room
    ? `<span class="chip"><span class="dot ${L.connected ? "" : "off"}" title="${L.connected ? "verbunden" : "keine Verbindung"}"></span>Spiel <b>${esc(L.room)}</b><button data-act="copy-link">Link kopieren</button></span>` : "";
  return `<span class="star">★</span><h1>Wikipedia-Speedrun</h1><span class="sp"></span><div class="mini">${scores}${room}</div>`;
}
function header() { return `<header class="top" id="hdr">${headerInner()}</header>`; }
function updateHeader() { const h = $("#hdr"); if (h) h.innerHTML = headerInner(); }

function joinView() {
  return `<div class="card join">
    <h2>Gemeinsames Spiel</h2>

    if (res) {
      status = res.status === "ok" ? `<span class="pill ok">geschafft</span>` : `<span class="pill gave">aufgegeben</span>`;
      if (res.status === "ok") { time = fmtTime(res.time); clicks = res.clicks; }
      else { time = `<span class="hint">${fmtTime(res.time)}</span>`; clicks = `<span class="hint">${res.clicks}</span>`; }
    } else if (r.playing[i]) status = `<span class="pill live">spielt gerade …</span>`;
    if (r.points) {
      const p = r.points[i] || { fast: 0, few: 0 };
      const parts = [];
      if (p.fast) parts.push("⏱ +1");
      if (p.few) parts.push("🖱 +1");
      pts = parts.length ? `<span class="pt">${parts.join(" ")}</span>` : `<span class="hint">0</span>`;
    }
    const pathTxt = res && res.path ? `<div class="path">${res.path.map(esc).join(" → ")}</div>` : "";
    const actions = r.points ? "" : (res
      ? `<button class="btn small sec" data-act="clear" data-i="${i}">Löschen</button>`
      : `<button class="btn small" data-act="play" data-i="${i}">Spielen</button> <button class="btn small sec" data-act="manual" data-i="${i}">Manuell</button>`);
    const manual = L.manualOpen === i && !r.points ? `<div class="manual">Zeit <input type="text" id="m-time" placeholder="m:ss"> Klicks <input type="text" id="m-clicks" placeholder="0"><button class="btn small" data-act="manual-save" data-i="${i}">Speichern</button><button class="btn small sec" data-act="manual-cancel">Abbrechen</button></div>` : "";
    return `<tr><td><b>${esc(t)}</b>${pathTxt}${manual}</td><td>${status}</td><td class="num">${time}</td><td class="num">${clicks}</td>${r.points ? `<td>${pts}</td>` : ""}<td style="white-space:nowrap">${actions}</td></tr>`;

  return `<div class="grid"><div>
    <div class="card">
      <div class="hint">Runde ${r.no}</div>
      <div class="route">${esc(r.start.title)}<span class="arr">➜</span>${esc(r.target.title)}</div>
      ${r.target.extract ? `<p class="extract"><b>Ziel:</b> ${esc(r.target.extract)}</p>` : ""}
    </div>
    <div class="card"><h2>Ergebnisse</h2>
      <div style="overflow-x:auto"><table class="t"><thead><tr><th>Team</th><th>Status</th><th>Zeit</th><th>Klicks</th>${r.points ? "<th>Punkte</th>" : ""}<th></th></tr></thead><tbody>${rows}</tbody></table></div>
      <div style="margin-top:16px">${bottom}</div>

  </div><div>${scoreboard()}

/* =====================================================================
   Spiellogik
   ===================================================================== */
function elapsed() { const run = L.run; return run.elapsed + (run.segStart != null ? (now() - run.segStart) / 1000 : 0); }
function startTick() { stopTick(); tick = setInterval(() => { const el = $("#timer"); if (el && L.run) el.textContent = fmtTime(elapsed()); }, 100); }
function stopTick() { if (tick) clearInterval(tick); tick = null; }
function pause() { const run = L.run; if (run.segStart != null) { run.elapsed += (now() - run.segStart) / 1000; run.segStart = null; } }
function resume() { if (L.run.segStart == null) L.run.segStart = now(); }
function updateBar() {
  $("#clicks").textContent = L.run.clicks;
  $("#timer").textContent = fmtTime(elapsed());
  $("#path").innerHTML = L.run.path.map(p => `<span class="step">${esc(p)}</span>`).join(" → ");
}

async function showArticle(title, isClick) {
  const art = $("#article");
  const run = L.run;
  run.loading = true;
  pause();
  const ov = document.createElement("div"); ov.className = "loading"; ov.textContent = "Lade Artikel …";
  art.appendChild(ov);
  try {
    const a = await fetchArticle(title);
    if (L.run !== run) return;
    const box = prepareArticle(a.html);
    art.innerHTML = `<h1 class="atitle">${esc(a.title)}</h1>`;
    art.appendChild(box);
    window.scrollTo(0, 0);
    run.path.push(a.title);
    run.loading = false;
    if (a.title === run.target) { finishRun("ok"); return; }
    resume();
    updateBar();
  } catch (e) {
    if (L.run !== run) return;
    run.loading = false;
    ov.remove();
    if (isClick) run.clicks--;
    const err = document.createElement("div"); err.className = "err-box";
    err.textContent = "Der Artikel konnte nicht geladen werden (" + e.message + "). Der Klick zählt nicht, versucht einen anderen Link.";
    art.prepend(err);
    if (run.path.length) resume();
    else err.textContent = "Der Startartikel konnte nicht geladen werden. Besteht eine Internetverbindung?";
    updateBar();
  }
}

async function finishRun(status) {
  pause();
  stopTick();
  const run = L.run;
  const res = { status, time: Math.round(run.elapsed * 1000) / 1000, clicks: run.clicks, path: run.path.slice() };
  L.lastResult = { ...res, teamName: S.teams[run.team], saveMsg: Store.mode === "online" ? "Ergebnis wird gespeichert …" : "" };
  L.view = "finish";
  render();
  let ok = false;
  try {
    ok = await Store.update(s => {
      if (!s.round || s.round.id !== run.roundId || s.round.points) return false;
      s.round.results[run.team] = res;
      delete s.round.playing[run.team];
    });
  } catch (e) { console.error(e); }
  L.lastResult.saveMsg = ok ? (Store.mode === "online" ? "✓ Ergebnis gespeichert, alle Geräte sehen es." : "")
    : "Das Ergebnis konnte nicht gespeichert werden, weil die Runde inzwischen beendet wurde oder keine Verbindung besteht. Tragt es notfalls mit „Manuell“ ein.";
  const el = $("#save-state"); if (el && L.view === "finish") el.textContent = L.lastResult.saveMsg;
}

function scoreMutation(s) {
  const r = s.round;
  if (!r || r.points) return false;
  const done = s.teams.map((_, i) => ({ x: r.results[i], i })).filter(o => o.x && o.x.status === "ok");
  r.points = s.teams.map(() => ({ fast: 0, few: 0 }));
  if (done.length) {
    const t = v => Math.round(v * 10);
    const minT = Math.min(...done.map(o => t(o.x.time)));
    const minC = Math.min(...done.map(o => o.x.clicks));
    done.forEach(o => { if (t(o.x.time) === minT) r.points[o.i].fast = 1; if (o.x.clicks === minC) r.points[o.i].few = 1; });
  }
  r.points.forEach((p, i) => { s.totals[i] = (s.totals[i] || 0) + p.fast + p.few; });
  const fastNames = r.points.map((p, i) => p.fast ? s.teams[i] : null).filter(Boolean);
  const fewNames = r.points.map((p, i) => p.few ? s.teams[i] : null).filter(Boolean);
  const summary = done.length ? `⏱ ${fastNames.join(", ")} · 🖱 ${fewNames.join(", ")}` : "niemand hat es geschafft";
  s.history.push({ no: r.no, start: r.start.title, target: r.target.title, summary });
}

/* =====================================================================
   Spielraum (Code im Link, z. B. …/#ABCDE)
   ===================================================================== */
function codeFromHash() {
  const h = decodeURIComponent(location.hash.replace(/^#/, "")).toUpperCase().trim();
  return /^[A-Z0-9]{5}$/.test(h) ? h : null;
}
async function enterRoom(code, checkExists) {
  if (checkExists && !(await Store.exists(code))) return false;
  if (location.hash !== "#" + code) history.replaceState(null, "", "#" + code);
  L.view = "loading";
  Store.join(code);
  return true;
}
function shareLink() { return location.href.split("#")[0] + "#" + L.room; }

/* =====================================================================
   Events
   ===================================================================== */
let pvTimers = {};
function previewField(f) {
  const inp = $("#in-" + f), pv = $("#pv-" + f);
  if (!inp || !pv) return;
  L.draft[f] = inp.value; saveJSON(LS_DRAFT, L.draft);
  clearTimeout(pvTimers[f]);
  const val = inp.value.trim();
  if (!val) { pv.className = "preview"; pv.textContent = ""; return; }
  pv.className = "preview"; pv.textContent = "Suche …";
  pvTimers[f] = setTimeout(async () => {
    try {
      const r = await resolveTitle(val);
      if (inp.value.trim() !== val) return;
      if (!r) { pv.className = "preview err"; pv.textContent = "Kein Artikel mit diesem Namen gefunden."; return; }
      pv.className = "preview ok";
      pv.innerHTML = `✓ <b>${esc(r.title)}</b>${r.extract ? " – " + esc(r.extract.slice(0, 180)) + (r.extract.length > 180 ? " …" : "") : ""}`;
    } catch (e) { pv.className = "preview err"; pv.textContent = "Wikipedia nicht erreichbar. Besteht eine Internetverbindung?"; }
  }, 450);
}

function bind() {
  document.querySelectorAll("[data-team]").forEach(inp => inp.addEventListener("change", () => {
    const i = +inp.dataset.team, v = inp.value.trim() || `Team ${i + 1}`;
    Store.update(s => { if (s.teams[i] === v) return false; s.teams[i] = v; });
  }));
  const lang = $("#in-lang");
  if (lang) lang.addEventListener("change", async () => {
    const v = lang.value;
    await Store.update(s => { s.lang = v; });
    previewField("start"); previewField("target");
  });
  ["start", "target"].forEach(f => { const inp = $("#in-" + f); if (inp) { inp.addEventListener("input", () => previewField(f)); if (inp.value) previewField(f); } });
  const code = $("#in-code");
  if (code) code.addEventListener("keydown", e => { if (e.key === "Enter") $("[data-act=join-room]").click(); });
  const art = $("#article");
  if (art) art.addEventListener("click", e => {
    const a = e.target.closest("a.ok");
    e.preventDefault();
    if (!a || !L.run || L.run.loading) return;
    L.run.clicks++;
    showArticle(a.dataset.go, true);
  });
}

/* Nach dem Tippen aufgeschobene Aktualisierung nachholen */
document.addEventListener("focusout", () => {
  setTimeout(() => {
    const ae = document.activeElement;
    if (L.pendingRender && !(ae && ae.tagName === "INPUT" && $("#app").contains(ae))) render();
  }, 150);
});

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act, i = b.dataset.i != null ? +b.dataset.i : null;
  switch (act) {
    case "create-room": {
      b.disabled = true; b.textContent = "Erstelle Spiel …";
      try { const code = await Store.create(); await enterRoom(code, false); }
      catch (err) { $("#join-err").innerHTML = `<div class="err-box">Spiel konnte nicht erstellt werden: ${esc(err.message)}</div>`; b.disabled = false; b.textContent = "Neues Spiel erstellen"; }
      break;
    }
    case "join-room": {
      const c = ($("#in-code").value || "").toUpperCase().trim();
      if (!/^[A-Z0-9]{5}$/.test(c)) { $("#join-err").innerHTML = `<div class="err-box">Der Code hat 5 Zeichen.</div>`; break; }
      b.disabled = true;
      try { if (!(await enterRoom(c, true))) { $("#join-err").innerHTML = `<div class="err-box">Kein Spiel mit diesem Code gefunden.</div>`; b.disabled = false; } }
      catch (err) { $("#join-err").innerHTML = `<div class="err-box">Keine Verbindung zur Datenbank: ${esc(err.message)}</div>`; b.disabled = false; }
      break;
    }
    case "leave-room": Store.leave(); history.replaceState(null, "", location.pathname + location.search); S = defaults(); L.view = "join"; render(); break;
    case "copy-link": {
      try { await navigator.clipboard.writeText(shareLink()); b.textContent = "Kopiert ✓"; }
      catch (err) { b.textContent = shareLink(); }
      setTimeout(updateHeader, 2000); break;
    }
    case "add-team": Store.update(s => { s.teams.push(`Team ${s.teams.length + 1}`); s.totals.push(0); }); break;
    case "del-team": Store.update(s => { if (s.round || s.teams.length <= 2) return false; s.teams.splice(i, 1); s.totals.splice(i, 1); }); break;
    case "rand": {
      const f = b.dataset.f; b.disabled = true;
      try { $("#in-" + f).value = await randomTitle(); previewField(f); }
      catch (err) { $("#pv-" + f).className = "preview err"; $("#pv-" + f).textContent = "Wikipedia nicht erreichbar."; }
      b.disabled = false; break;
    }
    case "start-round": {
      const s0 = $("#in-start").value.trim(), t0 = $("#in-target").value.trim();
      const errBox = $("#setup-err");
      const fail = msg => { errBox.innerHTML = `<div class="err-box">${msg}</div>`; b.disabled = false; b.textContent = "Runde starten"; };
      if (!s0 || !t0) { fail("Bitte Start- und Zielartikel eintragen."); break; }
      b.disabled = true; b.textContent = "Prüfe Artikel …";
      try {
        const [rs, rt] = await Promise.all([resolveTitle(s0), resolveTitle(t0)]);
        if (!rs || !rt) { fail(`${!rs ? "Startartikel" : "Zielartikel"} wurde nicht gefunden.`); break; }
        if (rs.title === rt.title) { fail("Start und Ziel sind derselbe Artikel."); break; }
        const id = uid();
        const ok = await Store.update(s => {
          if (s.round) return false;
          s.round = { id, no: s.history.length + 1, start: rs, target: rt, results: {}, playing: {}, points: null };
        });
        if (ok) { L.draft = { start: "", target: "" }; saveJSON(LS_DRAFT, L.draft); }
        L.view = "round"; render();
      } catch (err) { fail("Wikipedia oder die Datenbank ist nicht erreichbar. Besteht eine Internetverbindung?"); }
      break;
    }
    case "play":
      L.run = { team: i, roundId: S.round.id, target: S.round.target.title, clicks: 0, path: [], elapsed: 0, segStart: null, loading: false };
      L.manualOpen = null; L.view = "ready"; render(); break;
    case "go": {
      const run = L.run;
      if (!S.round || S.round.id !== run.roundId) { L.view = "round"; render(); break; }
      L.view = "play"; render(); startTick();
      Store.update(s => { if (!s.round || s.round.id !== run.roundId) return false; s.round.playing[run.team] = Date.now(); }).catch(() => {});
      showArticle(S.round.start.title, false);
      break;
    }
    case "giveup": if (L.run && !L.run.loading) finishRun("gave"); break;
    case "back-round": L.run = null; L.view = S.round ? "round" : "setup"; render(); break;
    case "clear": Store.update(s => { if (!s.round || s.round.points) return false; delete s.round.results[i]; delete s.round.playing[i]; }); break;
    case "manual": L.manualOpen = i; render(); break;
    case "manual-cancel": L.manualOpen = null; render(); break;
    case "manual-save": {
      const tm = parseTime($("#m-time").value), cl = parseInt($("#m-clicks").value, 10);
      if (isNaN(tm) || isNaN(cl) || cl < 0) { $("#m-time").style.borderColor = "var(--red)"; $("#m-clicks").style.borderColor = "var(--red)"; break; }
      L.manualOpen = null;
      const rid = S.round.id;
      await Store.update(s => { if (!s.round || s.round.id !== rid || s.round.points) return false; s.round.results[i] = { status: "ok", time: tm, clicks: cl, path: null }; delete s.round.playing[i]; });
      render(); break;
    }
    case "score": {
      const rid = S.round.id;
      b.disabled = true;
      await Store.update(s => { if (!s.round || s.round.id !== rid) return false; return scoreMutation(s); });
      render(); break;
    }
    case "next-round": { const rid = S.round && S.round.id; await Store.update(s => { if (!s.round || s.round.id !== rid || !s.round.points) return false; s.round = null; }); L.view = "setup"; render(); break; }
    case "abort-round": { const rid = S.round && S.round.id; await Store.update(s => { if (!s.round || s.round.id !== rid) return false; s.round = null; }); L.view = "setup"; render(); break; }
    case "reset": L.resetArmed = true; render(); break;
    case "reset-no": L.resetArmed = false; render(); break;
    case "reset-yes": {
      L.resetArmed = false; L.run = null;
      await Store.update(s => { const d = defaults(); s.totals = s.teams.map(() => 0); s.history = d.history; s.round = null; });
      L.view = "setup"; render(); break;
    }
  }
});

window.addEventListener("beforeunload", e => { if (L.view === "play") { e.preventDefault(); e.returnValue = ""; } });

/* =====================================================================
   Start
   ===================================================================== */
(async () => {
  await Store.init();
  if (Store.mode === "online") {
    const code = codeFromHash();
    if (code) {
      try {
        if (!(await enterRoom(code, true))) { L.notice = `Kein Spiel mit dem Code ${code} gefunden.`; L.view = "join"; render(); }
      } catch (e) { L.notice = "Keine Verbindung zur Datenbank: " + e.message; L.view = "join"; render(); }
    } else { L.view = "join"; render(); }
    window.addEventListener("hashchange", () => {
      const c = codeFromHash();
      if (c && c !== L.room && L.view !== "play") enterRoom(c, true).then(ok => { if (!ok) { L.notice = `Kein Spiel mit dem Code ${c} gefunden.`; L.view = "join"; render(); } });
    });
  } else {
    L.view = S.round ? "round" : "setup";
    render();
  }
})();
})();
</script>
</body>
</html>
