<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wikipedia-Speedrun – Weihnachtsedition</title>
<style>
:root{
  --bg:#f5f2ea; --card:#fff; --ink:#1d2321; --muted:#68716d; --line:#e3ded2;
  --green:#1e5a44; --green2:#2b7a5c; --red:#b3261e; --gold:#c4952b; --link:#0645ad;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
button,input,select{font:inherit}
header.top{background:var(--green);color:#fff;padding:12px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header.top h1{font-size:1.15rem;margin:0;font-weight:650;letter-spacing:.2px}
header.top .star{color:var(--gold);font-size:1.3rem}
header.top .sp{flex:1}
header.top .mini{font-size:.85rem;opacity:.9;display:flex;gap:14px;flex-wrap:wrap}
header.top .mini b{color:#ffe7a8}
main{max-width:1100px;margin:0 auto;padding:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:18px}
.card h2{margin:0 0 14px;font-size:1.15rem}
.grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
label{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 4px}
input[type=text],select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff}
input[type=text]:focus,select:focus{outline:2px solid var(--green2);border-color:transparent}
.row{display:flex;gap:8px;align-items:center}
.row > input{flex:1}
.btn{border:0;border-radius:8px;padding:9px 16px;cursor:pointer;background:var(--green);color:#fff;font-weight:600}
.btn:hover{background:var(--green2)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sec{background:#ece8de;color:var(--ink)}
.btn.sec:hover{background:#e2ddd0}
.btn.red{background:var(--red)}
.btn.big{padding:14px 28px;font-size:1.1rem}
.btn.small{padding:5px 10px;font-size:.85rem}
.hint{font-size:.85rem;color:var(--muted);margin-top:6px}
.preview{font-size:.85rem;color:var(--muted);margin-top:6px;min-height:1.2em}
.preview.ok b{color:var(--green)}
.preview.err{color:var(--red)}
table.t{width:100%;border-collapse:collapse}
table.t th,table.t td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top;font-size:.95rem}
table.t th{font-size:.8rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.num{font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.78rem;font-weight:600}
.pill.ok{background:#e1f1e8;color:var(--green)}
.pill.gave{background:#f7e3e1;color:var(--red)}
.pill.open{background:#efece4;color:var(--muted)}
.pt{color:var(--gold);font-weight:700}
.route{font-size:1.2rem;font-weight:650;margin:2px 0 6px}
.route .arr{color:var(--gold);margin:0 8px}
.extract{font-size:.88rem;color:var(--muted);margin:0}
.center{text-align:center}
.ready h2{font-size:2rem;margin:10px 0}
.ready .route{font-size:1.5rem;margin:18px 0}
.path{font-size:.85rem;color:var(--muted);word-break:break-word}
.path span.step{color:var(--ink)}
.manual{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
.manual input{width:90px;padding:5px 8px;border:1px solid var(--line);border-radius:6px}
.score li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}
.score ol{list-style:none;margin:0;padding:0}
.score .tot{font-weight:700;font-variant-numeric:tabular-nums}
.teams-edit .row{margin-bottom:6px}

/* Spielansicht */
.playbar{position:sticky;top:0;z-index:10;background:var(--green);color:#fff;padding:10px 22px;display:flex;gap:22px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.playbar .who{font-weight:700}
.playbar .goal{font-size:.95rem}
.playbar .goal b{color:#ffe7a8}
.playbar .stat{text-align:center}
.playbar .stat .v{font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.playbar .stat .l{font-size:.7rem;opacity:.8;text-transform:uppercase;letter-spacing:.5px}
.playbar .sp{flex:1}
.playbar .path{color:#d8eadf;flex-basis:100%;font-size:.8rem}
.playbar .path span.step{color:#fff}
.article{max-width:960px;margin:20px auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px 32px;position:relative}
.article h1.atitle{font-family:"Linux Libertine","Georgia","Times",serif;font-weight:400;font-size:2rem;border-bottom:1px solid #a2a9b1;margin:0 0 14px;padding-bottom:4px}
.wk{font-size:.95rem;line-height:1.6;overflow-x:auto}
.wk img{max-width:100%;height:auto}
.wk table{font-size:.85rem;max-width:100%}
.wk .infobox,.wk table.wikitable{border-collapse:collapse;background:#f8f9fa;border:1px solid #a2a9b1;margin:0 0 12px 16px}
.wk .infobox{float:right;max-width:320px}
.wk h2{font-family:"Linux Libertine","Georgia","Times",serif;font-weight:400;font-size:1.5rem;border-bottom:1px solid #a2a9b1;margin-top:1.2em}
.wk h3{font-size:1.15rem}
.wk figure,.wk .thumb{float:right;clear:right;margin:4px 0 12px 16px;max-width:260px;font-size:.8rem;color:#54595d}
.wk a{color:#7a8580;text-decoration:none;cursor:default;pointer-events:none}
.wk a.ok{color:var(--link);pointer-events:auto;cursor:pointer;text-decoration:none;border-bottom:1px solid rgba(6,69,173,.3)}
.wk a.ok:hover{background:#eaf1ff;border-bottom-color:var(--link)}
.wk sup.reference{display:none}
.wk .mw-editsection,.wk .navbox,.wk .mw-empty-elt{display:none}
.loading{position:absolute;inset:0;background:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--green);border-radius:10px;font-size:1.1rem}
.err-box{background:#fbe9e7;color:var(--red);padding:10px 14px;border-radius:8px;margin:10px 0}
.won{font-size:3rem;margin:4px 0}
.bigstats{display:flex;gap:40px;justify-content:center;margin:18px 0}
.bigstats .v{font-size:2.4rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--green)}
.bigstats .l{font-size:.8rem;color:var(--muted);text-transform:uppercase}
.rules{font-size:.9rem;color:var(--muted);margin:0;padding-left:18px}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:.85rem}
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
"use strict";

/* ---------- Zustand ---------- */
const LS_KEY = "wikiSpeedrun.weihnachten.v1";
const defaults = () => ({ lang: "de", teams: ["Team 1", "Team 2", "Team 3"], totals: [0, 0, 0], history: [], round: null, draft: { start: "", target: "" } });
let S = loadState() || defaults();
let run = null;          // aktueller Lauf (nicht gespeichert)
let tick = null;
let view = S.round ? "round" : "setup";
let resetArmed = false;

function loadState() { try { const v = JSON.parse(localStorage.getItem(LS_KEY)); return v && v.teams ? v : null; } catch (e) { return null; } }
function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- Helfer ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function fmtTime(sec) {
  if (sec == null || isNaN(sec)) return "–";
  const t = Math.max(0, Math.round(sec * 10));
  const m = Math.floor(t / 600), s = Math.floor((t % 600) / 10), d = t % 10;
  return `${m}:${String(s).padStart(2, "0")},${d}`;
}
function parseTime(str) {
  str = String(str).trim().replace(",", ".");
  if (!str) return NaN;
  if (str.includes(":")) { const [m, s] = str.split(":"); return Number(m) * 60 + Number(s); }
  return Number(str);
}
const now = () => performance.now();

/* ---------- Wikipedia-API ---------- */
async function api(params) {
  const url = `https://${S.lang}.wikipedia.org/w/api.php?` +
    new URLSearchParams({ ...params, format: "json", formatversion: "2", origin: "*" });
  const r = await fetch(url);
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
async function resolveTitle(t) {
  const d = await api({ action: "query", titles: t, redirects: "1", prop: "extracts", exintro: "1", explaintext: "1", exsentences: "2" });
  const p = d.query && d.query.pages && d.query.pages[0];
  if (!p || p.missing || p.invalid) return null;
  if (p.ns !== 0) return null;
  return { title: p.title, extract: p.extract || "" };
}
async function randomTitle() {
  const d = await api({ action: "query", list: "random", rnnamespace: "0", rnlimit: "1" });
  return d.query.random[0].title;
}
async function fetchArticle(t) {
  const d = await api({ action: "parse", page: t, redirects: "1", prop: "text", disableeditsection: "1", disablelimitreport: "1", disabletoc: "1" });
  if (d.error) throw new Error(d.error.info || "Artikel nicht gefunden");
  return { title: d.parse.title, html: d.parse.text };
}

/* Namensräume, deren Links nicht zählen (de + en) */
const NS = new Set(["datei","file","bild","image","media","medium","kategorie","category","hilfe","help","wikipedia","wp","portal","vorlage","template","spezial","special","benutzer","benutzerin","user","diskussion","talk","modul","module","draft","mediawiki","wikt","wiktionary","commons","s","q","n","b","v","d","w","de","en"]);
const EXCLUDE = 'table,figure,.thumb,.infobox,.navbox,.hatnote,[role="note"],.reference,.references,.mw-references-wrap,.gallery,.sidebar,.toc,#toc,.navigation-not-searchable,.metadata,#coordinates,.coordinates,sup,.mw-empty-elt';

function linkTitle(a) {
  const h = a.getAttribute("href") || "";
  if (!h.startsWith("/wiki/") && !h.startsWith("./")) return null;
  if (a.classList.contains("new") || a.classList.contains("external")) return null;
  let t = h.startsWith("/wiki/") ? h.slice(6) : h.slice(2);
  const hi = t.indexOf("#"); if (hi >= 0) t = t.slice(0, hi);
  const qi = t.indexOf("?"); if (qi >= 0) return null;
  try { t = decodeURIComponent(t); } catch (e) {}
  t = t.replace(/_/g, " ").trim();
  if (!t) return null;
  const ci = t.indexOf(":");
  if (ci > 0 && NS.has(t.slice(0, ci).trim().toLowerCase())) return null;
  return t;
}
function isParagraphLink(a) {
  if (!a.closest("p")) return false;
  if (a.closest(EXCLUDE)) return false;
  return true;
}
function prepareArticle(html) {
  const box = document.createElement("div");
  box.className = "wk";
  box.innerHTML = html;
  box.querySelectorAll("link, script, .mw-editsection").forEach(n => n.remove());
  box.querySelectorAll("img").forEach(img => {
    ["src", "srcset"].forEach(at => {
      const v = img.getAttribute(at);
      if (v) img.setAttribute(at, v.replace(/(^|\s|,)\/\//g, "$1https://"));
    });
    img.loading = "lazy";
  });
  let count = 0;
  box.querySelectorAll("a").forEach(a => {
    const t = linkTitle(a);
    if (t && isParagraphLink(a)) {
      a.classList.add("ok");
      a.dataset.go = t;
      a.setAttribute("href", "#");
      count++;
    } else {
      a.removeAttribute("href");
      a.removeAttribute("title");
    }
  });
  return { box, count };
}

/* ---------- Rendern ---------- */
function render() {
  if (view !== "play") stopTick();
  const app = $("#app");
  if (view === "setup") app.innerHTML = header() + `<main>${setupView()}</main>`;
  else if (view === "round") app.innerHTML = header() + `<main>${roundView()}</main>`;
  else if (view === "ready") app.innerHTML = header() + `<main>${readyView()}</main>`;
  else if (view === "finish") app.innerHTML = header() + `<main>${finishView()}</main>`;
  else if (view === "play") { app.innerHTML = playShell(); }
  bind();
}

function header() {
  const scores = S.teams.map((t, i) => `<span>${esc(t)}: <b>${S.totals[i] || 0}</b></span>`).join("");
  return `<header class="top"><span class="star">★</span><h1>Wikipedia-Speedrun</h1><span class="sp"></span><div class="mini">${scores}</div></header>`;
}

function scoreboard() {
  const order = S.teams.map((t, i) => ({ t, i, p: S.totals[i] || 0 })).sort((a, b) => b.p - a.p);
  const rows = order.map(o => `<li><span>${esc(o.t)}</span><span class="tot">${o.p} P.</span></li>`).join("");
  const hist = S.history.length ? `<label>Bisherige Runden</label>` + S.history.slice().reverse().map(h =>
    `<div class="hint">#${h.no} ${esc(h.start)} → ${esc(h.target)}: ${h.summary}</div>`).join("") : "";
  return `<div class="card score"><h2>Punktestand</h2><ol>${rows}</ol>${hist}
    <div style="margin-top:14px">${resetArmed
      ? `<span class="confirm">Wirklich alles löschen? <button class="btn small red" data-act="reset-yes">Ja</button><button class="btn small sec" data-act="reset-no">Nein</button></span>`
      : `<button class="btn small sec" data-act="reset">Alles zurücksetzen</button>`}</div></div>`;
}

function setupView() {
  const teamInputs = S.teams.map((t, i) => `<div class="row"><input type="text" data-team="${i}" value="${esc(t)}">${S.teams.length > 2 ? `<button class="btn small sec" data-act="del-team" data-i="${i}" title="Team entfernen">✕</button>` : ""}</div>`).join("");
  const no = S.history.length + 1;
  return `<div class="grid"><div>
    <div class="card">
      <h2>Runde ${no} vorbereiten</h2>
      <label>Startartikel</label>
      <div class="row"><input type="text" id="in-start" placeholder="z. B. Weihnachtsbaum" value="${esc(S.draft.start)}"><button class="btn sec" data-act="rand" data-f="start">🎲 Zufall</button></div>
      <div class="preview" id="pv-start"></div>
      <label>Zielartikel</label>
      <div class="row"><input type="text" id="in-target" placeholder="z. B. Albert Einstein" value="${esc(S.draft.target)}"><button class="btn sec" data-act="rand" data-f="target">🎲 Zufall</button></div>
      <div class="preview" id="pv-target"></div>
      <div id="setup-err"></div>
      <div style="margin-top:18px"><button class="btn big" data-act="start-round">Runde starten</button></div>
    </div>
    <div class="card"><h2>Regeln</h2>
      <ul class="rules">
        <li>Jedes Team startet auf dem Startartikel und muss nur über Links zum Zielartikel kommen.</li>
        <li>Klickbar sind nur blaue Links im normalen Fließtext. Infoboxen, Tabellen, Bildunterschriften, Listen und Navigationsleisten sind gesperrt.</li>
        <li>Kein Zurück-Button, keine Suche, keine Adresszeile.</li>
        <li>Die Uhr läuft nur, solange ein Artikel angezeigt wird. Ladezeiten zählen nicht.</li>
        <li>Pro Runde: 1 Punkt für die schnellste Zeit, 1 Punkt für die wenigsten Klicks. Bei Gleichstand bekommen alle Gleichplatzierten den Punkt.</li>
        <li>Wer nicht dran ist, schaut weg, damit niemand den Weg abgucken kann.</li>
      </ul>
    </div>
  </div><div>
    <div class="card teams-edit"><h2>Teams</h2>${teamInputs}
      <button class="btn small sec" data-act="add-team" style="margin-top:6px">+ Team</button>
      <label>Wikipedia-Sprache</label>
      <select id="in-lang"><option value="de" ${S.lang === "de" ? "selected" : ""}>Deutsch</option><option value="en" ${S.lang === "en" ? "selected" : ""}>Englisch</option></select>
    </div>
    ${scoreboard()}
  </div></div>`;
}

function roundView() {
  const r = S.round;
  const rows = S.teams.map((t, i) => {
    const res = r.results[i];
    let status = `<span class="pill open">offen</span>`, time = "–", clicks = "–", pts = "";
    if (res) {
      status = res.status === "ok" ? `<span class="pill ok">geschafft</span>` : `<span class="pill gave">aufgegeben</span>`;
      if (res.status === "ok") { time = fmtTime(res.time); clicks = res.clicks; }
      else { time = `<span class="hint">${fmtTime(res.time)}</span>`; clicks = `<span class="hint">${res.clicks}</span>`; }
    }
    if (r.points) {
      const p = r.points[i];
      const parts = [];
      if (p.fast) parts.push("⏱ +1");
      if (p.few) parts.push("🖱 +1");
      pts = parts.length ? `<span class="pt">${parts.join(" ")}</span>` : `<span class="hint">0</span>`;
    }
    const pathTxt = res && res.path ? `<div class="path">${res.path.map(esc).join(" → ")}</div>` : "";
    const actions = r.points ? "" : (res
      ? `<button class="btn small sec" data-act="clear" data-i="${i}">Löschen</button>`
      : `<button class="btn small" data-act="play" data-i="${i}">Jetzt spielen</button> <button class="btn small sec" data-act="manual" data-i="${i}">Manuell</button>`);
    const manual = r.manualOpen === i ? `<div class="manual">Zeit <input type="text" id="m-time" placeholder="m:ss"> Klicks <input type="text" id="m-clicks" placeholder="0"><button class="btn small" data-act="manual-save" data-i="${i}">Speichern</button><button class="btn small sec" data-act="manual-cancel">Abbrechen</button></div>` : "";
    return `<tr><td><b>${esc(t)}</b>${pathTxt}${manual}</td><td>${status}</td><td class="num">${time}</td><td class="num">${clicks}</td>${r.points ? `<td>${pts}</td>` : ""}<td style="white-space:nowrap">${actions}</td></tr>`;
  }).join("");
  const any = r.results.some(x => x);
  const allDone = r.results.every(x => x);
  const bottom = r.points
    ? `<button class="btn big" data-act="next-round">Nächste Runde</button>`
    : `<button class="btn ${allDone ? "big" : "sec"}" data-act="score" ${any ? "" : "disabled"}>Runde auswerten</button>
       ${allDone ? "" : `<div class="hint">Erst auswerten, wenn alle Teams gespielt haben. Teams, die auf einem anderen Gerät spielen, könnt ihr mit „Manuell“ eintragen.</div>`}`;
  return `<div class="grid"><div>
    <div class="card">
      <div class="hint">Runde ${r.no}</div>
      <div class="route">${esc(r.start.title)}<span class="arr">➜</span>${esc(r.target.title)}</div>
      ${r.target.extract ? `<p class="extract"><b>Ziel:</b> ${esc(r.target.extract)}</p>` : ""}
    </div>
    <div class="card"><h2>Ergebnisse</h2>
      <table class="t"><thead><tr><th>Team</th><th>Status</th><th>Zeit</th><th>Klicks</th>${r.points ? "<th>Punkte</th>" : ""}<th></th></tr></thead><tbody>${rows}</tbody></table>
      <div style="margin-top:16px">${bottom}</div>
    </div>
  </div><div>${scoreboard()}
    ${r.points ? "" : `<div class="card"><button class="btn small sec" data-act="abort-round">Runde abbrechen</button><div class="hint">Zurück zur Auswahl, ohne Punkte zu vergeben.</div></div>`}
  </div></div>`;
}

function readyView() {
  const r = S.round;
  return `<div class="card center ready">
    <div class="hint">Runde ${r.no}</div>
    <h2>${esc(S.teams[run.team])} ist dran!</h2>
    <div class="route">${esc(r.start.title)}<span class="arr">➜</span>${esc(r.target.title)}</div>
    ${r.target.extract ? `<p class="extract" style="max-width:620px;margin:0 auto 20px">${esc(r.target.extract)}</p>` : ""}
    <p class="hint">Andere Teams bitte wegschauen. Die Uhr startet, sobald der Startartikel angezeigt wird.</p>
    <div style="margin-top:20px"><button class="btn big" data-act="go">Los geht's!</button>
    <button class="btn sec" data-act="back-round" style="margin-left:8px">Zurück</button></div>
  </div>`;
}

function finishView() {
  const r = S.round, res = r.results[run.team];
  const ok = res.status === "ok";
  return `<div class="card center">
    <div class="won">${ok ? "🎄" : "🏳️"}</div>
    <h2 style="font-size:1.8rem;margin:0">${ok ? "Geschafft" : "Aufgegeben"}, ${esc(S.teams[run.team])}!</h2>
    <div class="bigstats"><div><div class="v">${fmtTime(res.time)}</div><div class="l">Zeit</div></div><div><div class="v">${res.clicks}</div><div class="l">Klicks</div></div></div>
    <div class="path" style="max-width:720px;margin:0 auto 20px">${res.path.map(p => `<span class="step">${esc(p)}</span>`).join(" → ")}</div>
    <button class="btn big" data-act="back-round">Weiter</button>
  </div>`;
}

function playShell() {
  const r = S.round;
  return `<div class="playbar">
      <div><div class="who">${esc(S.teams[run.team])}</div><div class="goal">Ziel: <b title="${esc(r.target.extract)}">${esc(r.target.title)}</b></div></div>
      <span class="sp"></span>
      <div class="stat"><div class="v" id="timer">0:00,0</div><div class="l">Zeit</div></div>
      <div class="stat"><div class="v" id="clicks">0</div><div class="l">Klicks</div></div>
      <button class="btn red small" data-act="giveup">Aufgeben</button>
      <div class="path" id="path"></div>
    </div>
    <div class="article" id="article"><div class="loading">Lade Artikel …</div></div>`;
}

/* ---------- Spiellogik ---------- */
function elapsed() { return run.elapsed + (run.segStart != null ? (now() - run.segStart) / 1000 : 0); }
function startTick() { stopTick(); tick = setInterval(() => { const el = $("#timer"); if (el && run) el.textContent = fmtTime(elapsed()); }, 100); }
function stopTick() { if (tick) clearInterval(tick); tick = null; }
function pause() { if (run.segStart != null) { run.elapsed += (now() - run.segStart) / 1000; run.segStart = null; } }
function resume() { if (run.segStart == null) run.segStart = now(); }
function updateBar() {
  $("#clicks").textContent = run.clicks;
  $("#timer").textContent = fmtTime(elapsed());
  $("#path").innerHTML = run.path.map(p => `<span class="step">${esc(p)}</span>`).join(" → ");
}

async function showArticle(title, isClick) {
  const art = $("#article");
  run.loading = true;
  pause();
  const ov = document.createElement("div"); ov.className = "loading"; ov.textContent = "Lade Artikel …";
  art.appendChild(ov);
  try {
    const a = await fetchArticle(title);
    if (!run) return;
    const { box } = prepareArticle(a.html);
    art.innerHTML = `<h1 class="atitle">${esc(a.title)}</h1>`;
    art.appendChild(box);
    window.scrollTo(0, 0);
    run.path.push(a.title);
    run.loading = false;
    if (a.title === S.round.target.title) { finishRun("ok"); return; }
    resume();
    updateBar();
  } catch (e) {
    if (!run) return;
    run.loading = false;
    ov.remove();
    if (isClick) run.clicks--;
    const err = document.createElement("div"); err.className = "err-box";
    err.textContent = "Der Artikel konnte nicht geladen werden (" + e.message + "). Der Klick zählt nicht, versucht einen anderen Link.";
    art.prepend(err);
    if (run.path.length) resume();
    else { err.textContent = "Der Startartikel konnte nicht geladen werden. Besteht eine Internetverbindung?"; }
    updateBar();
  }
}

function finishRun(status) {
  pause();
  stopTick();
  const r = S.round;
  r.results[run.team] = { status, time: run.elapsed, clicks: run.clicks, path: run.path.slice() };
  save();
  view = "finish";
  render();
}

function scoreRound() {
  const r = S.round;
  const done = r.results.map((x, i) => ({ x, i })).filter(o => o.x && o.x.status === "ok");
  r.points = r.results.map(() => ({ fast: 0, few: 0 }));
  if (done.length) {
    const t = v => Math.round(v * 10);
    const minT = Math.min(...done.map(o => t(o.x.time)));
    const minC = Math.min(...done.map(o => o.x.clicks));
    done.forEach(o => { if (t(o.x.time) === minT) r.points[o.i].fast = 1; if (o.x.clicks === minC) r.points[o.i].few = 1; });
  }
  r.points.forEach((p, i) => { S.totals[i] = (S.totals[i] || 0) + p.fast + p.few; });
  const fastNames = r.points.map((p, i) => p.fast ? S.teams[i] : null).filter(Boolean);
  const fewNames = r.points.map((p, i) => p.few ? S.teams[i] : null).filter(Boolean);
  const summary = done.length ? `⏱ ${esc(fastNames.join(", "))} · 🖱 ${esc(fewNames.join(", "))}` : "niemand hat es geschafft";
  S.history.push({ no: r.no, start: r.start.title, target: r.target.title, summary });
  save();
}

/* ---------- Events ---------- */
let pvTimers = {};
function previewField(f) {
  const inp = $("#in-" + f), pv = $("#pv-" + f);
  if (!inp || !pv) return;
  S.draft[f] = inp.value; save();
  clearTimeout(pvTimers[f]);
  const val = inp.value.trim();
  if (!val) { pv.className = "preview"; pv.textContent = ""; return; }
  pv.className = "preview"; pv.textContent = "Suche …";
  pvTimers[f] = setTimeout(async () => {
    try {
      const r = await resolveTitle(val);
      if (inp.value.trim() !== val) return;
      if (!r) { pv.className = "preview err"; pv.textContent = "Kein Artikel mit diesem Namen gefunden."; return; }
      pv.className = "preview ok";
      pv.innerHTML = `✓ <b>${esc(r.title)}</b>${r.extract ? " – " + esc(r.extract.slice(0, 180)) + (r.extract.length > 180 ? " …" : "") : ""}`;
    } catch (e) { pv.className = "preview err"; pv.textContent = "Wikipedia nicht erreichbar. Besteht eine Internetverbindung?"; }
  }, 450);
}

function bind() {
  document.querySelectorAll("[data-team]").forEach(inp => inp.addEventListener("input", () => {
    S.teams[+inp.dataset.team] = inp.value || `Team ${+inp.dataset.team + 1}`; save();
  }));
  const lang = $("#in-lang");
  if (lang) lang.addEventListener("change", () => { S.lang = lang.value; save(); previewField("start"); previewField("target"); });
  ["start", "target"].forEach(f => { const inp = $("#in-" + f); if (inp) { inp.addEventListener("input", () => previewField(f)); if (inp.value) previewField(f); } });
  const art = $("#article");
  if (art) art.addEventListener("click", e => {
    const a = e.target.closest("a.ok");
    e.preventDefault();
    if (!a || !run || run.loading) return;
    run.clicks++;
    showArticle(a.dataset.go, true);
  });
}

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act, i = b.dataset.i != null ? +b.dataset.i : null;
  switch (act) {
    case "add-team": S.teams.push(`Team ${S.teams.length + 1}`); S.totals.push(0); save(); render(); break;
    case "del-team": S.teams.splice(i, 1); S.totals.splice(i, 1); save(); render(); break;
    case "rand": {
      const f = b.dataset.f; b.disabled = true;
      try { $("#in-" + f).value = await randomTitle(); previewField(f); }
      catch (err) { $("#pv-" + f).className = "preview err"; $("#pv-" + f).textContent = "Wikipedia nicht erreichbar."; }
      b.disabled = false; break;
    }
    case "start-round": {
      const s = $("#in-start").value.trim(), t = $("#in-target").value.trim();
      const errBox = $("#setup-err");
      if (!s || !t) { errBox.innerHTML = `<div class="err-box">Bitte Start- und Zielartikel eintragen.</div>`; break; }
      b.disabled = true; b.textContent = "Prüfe Artikel …";
      try {
        const [rs, rt] = await Promise.all([resolveTitle(s), resolveTitle(t)]);
        if (!rs || !rt) { errBox.innerHTML = `<div class="err-box">${!rs ? "Startartikel" : "Zielartikel"} wurde nicht gefunden.</div>`; b.disabled = false; b.textContent = "Runde starten"; break; }
        if (rs.title === rt.title) { errBox.innerHTML = `<div class="err-box">Start und Ziel sind derselbe Artikel.</div>`; b.disabled = false; b.textContent = "Runde starten"; break; }
        S.round = { no: S.history.length + 1, start: rs, target: rt, results: S.teams.map(() => null), points: null };
        save(); view = "round"; render();
      } catch (err) {
        errBox.innerHTML = `<div class="err-box">Wikipedia ist nicht erreichbar. Besteht eine Internetverbindung?</div>`;
        b.disabled = false; b.textContent = "Runde starten";
      }
      break;
    }
    case "play": run = { team: i, clicks: 0, path: [], elapsed: 0, segStart: null, loading: false }; view = "ready"; render(); break;
    case "go": view = "play"; render(); startTick(); showArticle(S.round.start.title, false); break;
    case "giveup": if (run && !run.loading) finishRun("gave"); break;
    case "back-round": run = null; view = "round"; render(); break;
    case "clear": S.round.results[i] = null; save(); render(); break;
    case "manual": S.round.manualOpen = i; render(); break;
    case "manual-cancel": S.round.manualOpen = null; render(); break;
    case "manual-save": {
      const tm = parseTime($("#m-time").value), cl = parseInt($("#m-clicks").value, 10);
      if (isNaN(tm) || isNaN(cl) || cl < 0) { $("#m-time").style.borderColor = "var(--red)"; $("#m-clicks").style.borderColor = "var(--red)"; break; }
      S.round.results[i] = { status: "ok", time: tm, clicks: cl, path: null };
      S.round.manualOpen = null; save(); render(); break;
    }
    case "score": scoreRound(); render(); break;
    case "next-round": S.round = null; S.draft = { start: "", target: "" }; save(); view = "setup"; render(); break;
    case "abort-round": S.round = null; save(); view = "setup"; render(); break;
    case "reset": resetArmed = true; render(); break;
    case "reset-no": resetArmed = false; render(); break;
    case "reset-yes": { const lang = S.lang, teams = S.teams.slice(); S = defaults(); S.lang = lang; S.teams = teams; S.totals = teams.map(() => 0); resetArmed = false; run = null; save(); view = "setup"; render(); break; }
  }
});

window.addEventListener("beforeunload", e => { if (view === "play") { e.preventDefault(); e.returnValue = ""; } });

if (S.teams.length !== S.totals.length) S.totals = S.teams.map((_, i) => S.totals[i] || 0);
render();
})();
</script>
